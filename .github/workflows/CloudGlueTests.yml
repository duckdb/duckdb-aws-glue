# Runs all sqllogictests of a pull request or a branch, on a release build, against a live AWS Glue Data Catalog
# (test/configs/cloud_glue.json). It runs
#   - on every push to main; a failing run lists the merges since the last passing one in its job summary
#   - on a pull request when a maintainer adds the 'cloud-tests' label, and on later pushes to a labeled PR whose
#     author is a member or collaborator. The PR's code runs with the AWS credentials of the 'cloud-glue' environment,
#     so read an outside contributor's PR before labeling it, and remove and re-add the label after reading new commits
#   - when a maintainer starts it (`gh workflow run CloudGlueTests.yml -f pr_number=123`, or without pr_number for the
#     branch the run is started on, e.g. `gh workflow run CloudGlueTests.yml --ref main`)
#
# The 'cloud-glue' environment provides:
#   variables  GLUE_CATALOG_ID       the AWS account id of the Glue Data Catalog
#              GLUE_REGION           its region, e.g. eu-north-1
#              AWS_ROLE_ARN          optional: an IAM role to assume through GitHub's OIDC provider
#   secrets    AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY, when no AWS_ROLE_ARN is given
# The tests write to the bucket duckdb-glue-ci-<account id>-<region>, which the workflow creates if it does not exist,
# under duckdb-aws-glue-cloud-tests/ci-<run id>-<attempt>/, which it deletes at the end; a lifecycle rule expires
# whatever a failed run leaves under duckdb-aws-glue-cloud-tests/ after 2 days.
# The credentials need Glue access to that account, and S3 access to that bucket including s3:CreateBucket and
# s3:PutLifecycleConfiguration, and glue:GetDatabases, DeleteDatabase and CreateDatabase: every run first deletes all
# Glue databases of the account (with their tables) and creates an empty 'default', so that what a failed run left
# behind does not fail the next one. Use an account that holds nothing else.

name: Cloud Glue tests

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: Number of the pull request whose head commit is tested; empty tests the selected branch
        required: false
        type: string
  push:
    branches: [main]
  pull_request_target:
    types: [labeled, synchronize]

permissions:
  contents: read

jobs:
  cloud-glue-tests:
    if: >-
      github.event_name != 'pull_request_target' ||
      (github.event.action == 'labeled' && github.event.label.name == 'cloud-tests') ||
      (github.event.action == 'synchronize' && contains(github.event.pull_request.labels.*.name, 'cloud-tests') &&
       contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.pull_request.author_association))
    # ubuntu-26.04 (GCC 15.2) fails to build vcpkg's snappy 1.2.2: __m256i used without <immintrin.h>
    runs-on: ubuntu-24.04
    environment: cloud-glue

    # the tests share the Glue catalog of the account: one run at a time. On the job, not the workflow, so that the
    # skipped runs of every other PR push do not replace a waiting run
    concurrency:
      group: cloud-glue-tests
      cancel-in-progress: false

    permissions:
      contents: read
      # the commit status on the tested commit
      statuses: write
      # the last passing run on main, for the summary of a failing one
      actions: read
      # AWS_ROLE_ARN: OIDC token for configure-aws-credentials
      id-token: write

    env:
      GEN: ninja
      PR_NUMBER: ${{ inputs.pr_number || github.event.pull_request.number }}
      # the AWS SDK would otherwise ask the EC2 metadata service for a region, which hangs off EC2
      AWS_EC2_METADATA_DISABLED: "true"
      AWS_REGION: ${{ vars.GLUE_REGION }}

    steps:
      # workflow_dispatch and labeling already need write or triage access; running a PR's code with the AWS
      # credentials needs more. A push to main or to a labeled PR of a member is not checked
      - name: Check that a maintainer started the run
        if: github.event_name == 'workflow_dispatch' || github.event.action == 'labeled'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          role=$(gh api "repos/${{ github.repository }}/collaborators/${{ github.triggering_actor }}/permission" --jq .role_name)
          echo "${{ github.triggering_actor }} has role '$role'"
          if [ "$role" != "admin" ] && [ "$role" != "maintain" ]; then
            echo "::error::Only maintainers can run the cloud Glue tests"
            exit 1
          fi

      - name: Check the configuration
        run: |
          missing=0
          for name in GLUE_CATALOG_ID GLUE_REGION; do
            if [ -z "${!name}" ]; then
              echo "::error::Variable $name is not set in the 'cloud-glue' environment"
              missing=1
            fi
          done
          exit $missing
        env:
          GLUE_CATALOG_ID: ${{ vars.GLUE_CATALOG_ID }}
          GLUE_REGION: ${{ vars.GLUE_REGION }}

      # resolve the commit once: a push to the PR or branch during the run does not change what is tested
      - name: Resolve the commit
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -z "$PR_NUMBER" ]; then
            echo "sha=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
            echo "Testing $GITHUB_REF_NAME at $GITHUB_SHA"
            exit 0
          fi
          if ! [[ "$PR_NUMBER" =~ ^[0-9]+$ ]]; then
            echo "::error::pr_number must be a pull request number, got '$PR_NUMBER'"
            exit 1
          fi
          gh api "repos/${{ github.repository }}/pulls/$PR_NUMBER" \
            --jq '"sha=\(.head.sha)\ntitle=\(.title)\nstate=\(.state)"' >> "$GITHUB_OUTPUT"
          gh api "repos/${{ github.repository }}/pulls/$PR_NUMBER" \
            --jq '"Testing PR #\(.number) (\(.state)) \(.title) at \(.head.sha)"'

      - name: Mark the commit as pending
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${{ github.repository }}/statuses/${{ steps.pr.outputs.sha }}" \
            -f state=pending -f context="Cloud Glue tests" -f description="Running against the cloud Glue catalog" \
            -f target_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.pr.outputs.sha }}
          submodules: recursive
          persist-credentials: false
          # the merges since the last passing run on main
          fetch-depth: 0

      # the build and its vcpkg dependencies otherwise fill the runner's disk
      - name: Free disk space
        uses: ./duckdb/.github/actions/cleanup_runner

      - name: Install build dependencies
        run: |
          sudo apt-get update -y -qq
          sudo apt-get install -y -qq ninja-build jq

      - name: Setup Ccache
        uses: ./duckdb/.github/actions/ccache-action
        with:
          save: false

      - name: Build
        uses: duckdb/duckdb-ci/build-duckdb@main
        with:
          build-type: release
          build: python3 duckdb/scripts/ci/retry.py -- make release
          vcpkg-commit: cd61e1e26a038e82d6550a3ebbe0fbbfe7da78e3 # Release 2026.06.2

      - name: AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-access-key-id: ${{ vars.AWS_ROLE_ARN == '' && secrets.AWS_ACCESS_KEY_ID || '' }}
          aws-secret-access-key: ${{ vars.AWS_ROLE_ARN == '' && secrets.AWS_SECRET_ACCESS_KEY || '' }}
          aws-region: ${{ vars.GLUE_REGION }}

      - name: Empty the Glue catalog
        run: |
          account=$(aws sts get-caller-identity --query Account --output text)
          if [ "$account" != "$GLUE_CATALOG_ID" ]; then
            echo "::error::The credentials are for account $account, not the catalog $GLUE_CATALOG_ID: refusing to empty it"
            exit 1
          fi
          for database in $(aws glue get-databases --catalog-id "$GLUE_CATALOG_ID" --query 'DatabaseList[].Name' --output text); do
            echo "Deleting Glue database $database"
            aws glue delete-database --catalog-id "$GLUE_CATALOG_ID" --name "$database"
          done
          aws glue create-database --catalog-id "$GLUE_CATALOG_ID" --database-input Name=default
        env:
          GLUE_CATALOG_ID: ${{ vars.GLUE_CATALOG_ID }}

      - name: Test bucket
        id: bucket
        run: |
          bucket="duckdb-glue-ci-$GLUE_CATALOG_ID-$GLUE_REGION"
          if ! aws s3api head-bucket --bucket "$bucket" --expected-bucket-owner "$GLUE_CATALOG_ID" 2>/dev/null; then
            if [ "$GLUE_REGION" = "us-east-1" ]; then
              aws s3api create-bucket --bucket "$bucket"
            else
              aws s3api create-bucket --bucket "$bucket" --create-bucket-configuration "LocationConstraint=$GLUE_REGION"
            fi
          fi
          aws s3api put-bucket-lifecycle-configuration --bucket "$bucket" --expected-bucket-owner "$GLUE_CATALOG_ID" \
            --lifecycle-configuration '{"Rules": [{"ID": "expire-ci-data", "Status": "Enabled", "Filter": {"Prefix": "duckdb-aws-glue-cloud-tests/"},
              "Expiration": {"Days": 2}, "AbortIncompleteMultipartUpload": {"DaysAfterInitiation": 1}}]}'
          echo "location=s3://$bucket/duckdb-aws-glue-cloud-tests/ci-${{ github.run_id }}-${{ github.run_attempt }}" >> "$GITHUB_OUTPUT"
        env:
          GLUE_CATALOG_ID: ${{ vars.GLUE_CATALOG_ID }}
          GLUE_REGION: ${{ vars.GLUE_REGION }}

      # cloud_glue.json with the catalog, region and S3 prefix of the run; the credentials reach the S3 secret and the
      # Glue client through the credential chain (environment variables)
      - name: Test config
        run: |
          jq --arg catalog "$GLUE_CATALOG_ID" --arg region "$GLUE_REGION" --arg location "$DEFAULT_S3_LOCATION" '
            .on_init |= sub("REGION '"'"'[^'"'"']*'"'"'"; "REGION '"'"'\($region)'"'"'")
            | .test_env |= map(
                if .env_name == "GLUE_CATALOG_ID" then .env_value = $catalog
                elif .env_name == "DEFAULT_S3_LOCATION" then .env_value = $location
                else . end)
          ' test/configs/cloud_glue.json > "$RUNNER_TEMP/cloud_glue_ci.json"
          jq '{on_init, test_env}' "$RUNNER_TEMP/cloud_glue_ci.json"
        env:
          GLUE_CATALOG_ID: ${{ vars.GLUE_CATALOG_ID }}
          GLUE_REGION: ${{ vars.GLUE_REGION }}
          DEFAULT_S3_LOCATION: ${{ steps.bucket.outputs.location }}

      - name: Run tests
        id: tests
        run: |
          set -o pipefail
          make test-cloud TEST_BUILD=release CLOUD_TEST_CONFIG="$RUNNER_TEMP/cloud_glue_ci.json" 2>&1 \
            | tee "$RUNNER_TEMP/cloud_tests.log"

      - name: Summarize the failures
        if: failure() && steps.tests.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.pr.outputs.sha }}
        run: |
          failed=$(grep -oE '^test/[^ ]*:[0-9]+: FAILED' "$RUNNER_TEMP/cloud_tests.log" | sed 's/: FAILED$//' | sort -u || true)
          {
            echo "## Failing tests"
            echo
            if [ -n "$failed" ]; then
              echo "$failed" | sed 's/^/- `/; s/$/`/'
            else
              echo "No failing test found in the output: see the log of the Run tests step"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ github.event_name }}" != "push" ]; then
            exit 0
          fi
          last=$(gh run list --repo "${{ github.repository }}" --workflow CloudGlueTests.yml --branch main --event push \
            --status success --limit 1 --json headSha --jq '.[0].headSha // empty')
          {
            echo
            if [ -z "$last" ] || ! git cat-file -e "$last^{commit}" 2>/dev/null; then
              echo "No earlier passing run on main to compare with."
            else
              echo "## Merged since the last passing run on main (${last:0:10})"
              echo
              git log --first-parent --format='- %h %s (%an)' "$last..$SHA"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      # the trailing slash keeps the prefix from matching another run's, e.g. ci-123-1 and ci-123-10
      - name: Delete the run's S3 data
        if: always() && steps.bucket.outputs.location != ''
        run: aws s3 rm --recursive --only-show-errors "${{ steps.bucket.outputs.location }}/"

      - name: Report the result on the commit
        if: always() && steps.pr.outputs.sha != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            state=success; description="All tests passed against the cloud Glue catalog"
          else
            state=failure; description="Failed against the cloud Glue catalog"
          fi
          gh api "repos/${{ github.repository }}/statuses/${{ steps.pr.outputs.sha }}" \
            -f state=$state -f context="Cloud Glue tests" -f description="$description" \
            -f target_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
