# Regression run of the benchmarks under benchmark/ (modelled on duckdb-iceberg's Regression.yml): one job builds the
# benchmark runner for the PR and for its merge base with the base branch, then two jobs (parquet and csv/json tables) compare
# the timings of both with duckdb/scripts/regression/test_runner.py. The benchmarks read from the local Glue (moto) + S3
# of scripts/docker-compose.yml, so no AWS credentials are needed. On main only the first build runs, to save the ccache
# and vcpkg caches that PR branches restore from.

name: Regression
on:
  workflow_call:
    inputs:
      git_ref:
        type: string
      base_hash:
        type: string
  workflow_dispatch:
    inputs:
      git_ref:
        description: 'Git ref to test for current release'
        type: string
      base_hash:
        description: 'Base hash'
        type: string
  repository_dispatch:
  push:
  pull_request:
    types: [opened, reopened, ready_for_review, converted_to_draft, synchronize]

concurrency:
  group: regression-${{ github.workflow }}-${{ github.ref }}-${{ github.head_ref || '' }}-${{ github.base_ref || '' }}-${{ github.ref != 'refs/heads/main' || github.sha }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  GIT_REF: ${{ inputs.git_ref != '' && inputs.git_ref || github.sha }}
  BASE_BRANCH: ${{ github.base_ref || 'main' }}
  BASE_HASH: ${{ inputs.base_hash }}

jobs:
  check-draft:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-24.04
    steps:
      - name: Preliminary checks on CI
        run: echo "Event name is ${{ github.event_name }}"

  build-benchmark-runners:
    name: Build Benchmark Runners
    needs: check-draft
    # ubuntu-26.04 (GCC 15.2) fails to build vcpkg's snappy 1.2.2: __m256i used without <immintrin.h>
    runs-on: ubuntu-24.04
    env:
      GEN: ninja
      CC: clang-20
      CXX: clang++-20
      # lets the base build in base/ hit the ccache entries of the PR build
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_NOHASHDIR: "true"
      IS_MAIN: ${{ github.ref == 'refs/heads/main' }}

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ env.GIT_REF }}
          submodules: 'true'

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install tools
        run: python3 duckdb/scripts/ci/retry.py -- make -C duckdb toolsci

      - name: Setup Ccache
        uses: hendrikmuhs/ccache-action@main
        with:
          key: ${{ github.job }}
          save: ${{ github.ref == 'refs/heads/main' || github.repository != 'duckdb/duckdb' }}

      - name: Build Benchmark (release)
        uses: duckdb/duckdb-ci/build-duckdb@main
        env:
          STATIC_LIBCPP: 1
          ENABLE_EXTENSION_AUTOLOADING: 1
          ENABLE_EXTENSION_AUTOINSTALL: 1
          BUILD_BENCHMARK: 1
        with:
          build-type: release
          build: python3 duckdb/scripts/ci/retry.py -- make release
          vcpkg-commit: cd61e1e26a038e82d6550a3ebbe0fbbfe7da78e3 # Release 2026.06.2

      - name: Select base ref
        if: env.IS_MAIN != 'true'
        run: |
          git fetch origin "${BASE_BRANCH}:refs/remotes/origin/${BASE_BRANCH}"
          if [[ -n "${BASE_HASH}" ]]; then
            BASE_REF="${BASE_HASH}"
          elif [[ "${{ github.event_name }}" == "pull_request" ]]; then
            BASE_REF="$(git merge-base "${GIT_REF}" "origin/${BASE_BRANCH}")"
            if [[ -z "${BASE_REF}" ]]; then
              echo "Failed to compute merge base between ${GIT_REF} and origin/${BASE_BRANCH}"
              exit 1
            fi
          else
            BASE_REF="$(git rev-parse "origin/${BASE_BRANCH}")"
          fi
          echo "Selected base ref: ${BASE_REF}"
          echo "BASE_REF=${BASE_REF}" >> "$GITHUB_ENV"

      - name: Checkout Base Branch
        if: env.IS_MAIN != 'true'
        run: |
          rm -rf base
          git clone . base
          cd base
          git checkout "${BASE_REF}"
          git submodule update --init --recursive

      - name: Build Base Benchmark (release)
        if: env.IS_MAIN != 'true'
        uses: duckdb/duckdb-ci/build-duckdb@main
        env:
          STATIC_LIBCPP: 1
          ENABLE_EXTENSION_AUTOLOADING: 1
          ENABLE_EXTENSION_AUTOINSTALL: 1
          BUILD_BENCHMARK: 1
        with:
          build-type: release
          build: python3 duckdb/scripts/ci/retry.py -- make -C base release
          vcpkg-commit: cd61e1e26a038e82d6550a3ebbe0fbbfe7da78e3

      # the runners load the extensions (httpfs, avro, ...) from the repository directory next to their build
      - name: Upload benchmark runners
        if: env.IS_MAIN != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-runners
          retention-days: 1
          if-no-files-found: error
          path: |
            build/release/benchmark/benchmark_runner
            build/release/repository
            base/build/release/benchmark/benchmark_runner
            base/build/release/repository

  regression-test-benchmark-runner:
    name: Regression Tests (${{ matrix.name }})
    needs: build-benchmark-runners
    if: github.ref != 'refs/heads/main'
    # ubuntu-26.04 (GCC 15.2) fails to build vcpkg's snappy 1.2.2: __m256i used without <immintrin.h>
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      # Two jobs of ~3 minutes each, so only the join-heavy TPC-H and TPC-DS queries: every query costs 10-30s against
      # moto. parquet runs TPC-DS at SF1, csv TPC-H at SF0.1 and TPC-DS at SF0.01.
      matrix:
        include:
          - name: parquet
            benchmarks: '^benchmark/([^/]+|pushdown/join_filter_partition_pruning(_two_keys)?|optimizer/(common_subplan|estimate_cardinality_for_join_order_optimizer)|tpcds/sf1/parquet/q64)\.benchmark$'
          - name: csv/json
            benchmarks: '^benchmark/((optimizer/estimate_cardinality_for_join_order_optimizer|pushdown/join_filter_partition_pruning)_(csv|json)|tpch/sf0\.1/csv/q(09|18|21)|tpcds/sf0\.01/csv/q(14|64|72|78))\.benchmark$'
    env:
      # the AWS SDK would otherwise ask the EC2 metadata service for a region, which hangs off EC2
      AWS_EC2_METADATA_DISABLED: "true"
      BENCHMARKS: ${{ matrix.benchmarks }}

    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.GIT_REF }}
          submodules: 'true'

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Download benchmark runners
        uses: actions/download-artifact@v4
        with:
          name: benchmark-runners

      - name: Restore permissions
        run: chmod +x build/release/benchmark/benchmark_runner base/build/release/benchmark/benchmark_runner

      - name: Set up Docker Compose
        uses: docker/setup-compose-action@v1

      # --wait only waits for the containers to run, not for moto to answer: wait for the init container too, which
      # retries until moto and S3 answer and then creates the bucket and the Glue database 'default'. Without it the
      # first benchmark (heavily_partitioned_table, whose load attaches right away) got no response from moto.
      - name: Start Glue (moto) and S3
        run: |
          docker compose -f scripts/docker-compose.yml up -d --wait
          test "$(docker wait glue-init)" = 0

      # The benchmark files of the PR checkout are run by both runners (the benchmark runner resolves the paths
      # against the working directory, which test_runner.py isolates per runner).
      - name: Regression Test benchmarks
        run: |
          mkdir -p .github/regression
          find benchmark -name '*.benchmark' | sort | grep -E "${BENCHMARKS}" > .github/regression/benchmarks.csv
          python duckdb/scripts/regression/test_runner.py --old base/build/release/benchmark/benchmark_runner --new build/release/benchmark/benchmark_runner --benchmarks .github/regression/benchmarks.csv --verbose --threads 2 --samples 5

      - name: Server logs
        if: always()
        run: docker compose -f scripts/docker-compose.yml logs --no-color moto | tail -200
