# Regression run of the benchmarks under benchmark/ (modelled on duckdb-iceberg's Regression.yml): one job builds the
# benchmark runner for the PR and for its merge base with the base branch, then a job per table format compares the
# timings of both with duckdb/scripts/regression/test_runner.py. The benchmarks read from the local Glue (moto) + S3 of
# scripts/docker-compose.yml, so no AWS credentials are needed. On main only the first build runs, to save the ccache and
# vcpkg caches that PR branches restore from.

name: Regression
on:
  workflow_call:
    inputs:
      git_ref:
        type: string
      base_hash:
        type: string
  workflow_dispatch:
    inputs:
      git_ref:
        description: 'Git ref to test for current release'
        type: string
      base_hash:
        description: 'Base hash'
        type: string
  repository_dispatch:
  push:
  pull_request:
    types: [opened, reopened, ready_for_review, converted_to_draft, synchronize]

concurrency:
  group: regression-${{ github.workflow }}-${{ github.ref }}-${{ github.head_ref || '' }}-${{ github.base_ref || '' }}-${{ github.ref != 'refs/heads/main' || github.sha }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  GIT_REF: ${{ inputs.git_ref != '' && inputs.git_ref || github.sha }}
  BASE_BRANCH: ${{ github.base_ref || 'main' }}
  BASE_HASH: ${{ inputs.base_hash }}

jobs:
  check-draft:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-24.04
    steps:
      - name: Preliminary checks on CI
        run: echo "Event name is ${{ github.event_name }}"

  build-benchmark-runners:
    name: Build Benchmark Runners
    needs: check-draft
    runs-on: ubuntu-latest
    env:
      GEN: ninja
      CC: clang-20
      CXX: clang++-20
      # lets the base build in base/ hit the ccache entries of the PR build
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_NOHASHDIR: "true"
      IS_MAIN: ${{ github.ref == 'refs/heads/main' }}

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ env.GIT_REF }}
          submodules: 'true'

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install tools
        run: python3 duckdb/scripts/ci/retry.py -- make -C duckdb toolsci

      - name: Setup Ccache
        uses: hendrikmuhs/ccache-action@main
        with:
          key: ${{ github.job }}
          save: ${{ github.ref == 'refs/heads/main' || github.repository != 'duckdb/duckdb' }}

      - name: Build Benchmark (release)
        uses: duckdb/duckdb-ci/build-duckdb@main
        env:
          STATIC_LIBCPP: 1
          ENABLE_EXTENSION_AUTOLOADING: 1
          ENABLE_EXTENSION_AUTOINSTALL: 1
          BUILD_BENCHMARK: 1
        with:
          build-type: release
          build: python3 duckdb/scripts/ci/retry.py -- make release
          vcpkg-commit: cd61e1e26a038e82d6550a3ebbe0fbbfe7da78e3 # Release 2026.06.2

      - name: Select base ref
        if: env.IS_MAIN != 'true'
        run: |
          git fetch origin "${BASE_BRANCH}:refs/remotes/origin/${BASE_BRANCH}"
          if [[ -n "${BASE_HASH}" ]]; then
            BASE_REF="${BASE_HASH}"
          elif [[ "${{ github.event_name }}" == "pull_request" ]]; then
            BASE_REF="$(git merge-base "${GIT_REF}" "origin/${BASE_BRANCH}")"
            if [[ -z "${BASE_REF}" ]]; then
              echo "Failed to compute merge base between ${GIT_REF} and origin/${BASE_BRANCH}"
              exit 1
            fi
          else
            BASE_REF="$(git rev-parse "origin/${BASE_BRANCH}")"
          fi
          echo "Selected base ref: ${BASE_REF}"
          echo "BASE_REF=${BASE_REF}" >> "$GITHUB_ENV"

      - name: Checkout Base Branch
        if: env.IS_MAIN != 'true'
        run: |
          rm -rf base
          git clone . base
          cd base
          git checkout "${BASE_REF}"
          git submodule update --init --recursive

      - name: Build Base Benchmark (release)
        if: env.IS_MAIN != 'true'
        uses: duckdb/duckdb-ci/build-duckdb@main
        env:
          STATIC_LIBCPP: 1
          ENABLE_EXTENSION_AUTOLOADING: 1
          ENABLE_EXTENSION_AUTOINSTALL: 1
          BUILD_BENCHMARK: 1
        with:
          build-type: release
          build: python3 duckdb/scripts/ci/retry.py -- make -C base release
          vcpkg-commit: cd61e1e26a038e82d6550a3ebbe0fbbfe7da78e3

      # the runners load the extensions (httpfs, avro, ...) from the repository directory next to their build
      - name: Upload benchmark runners
        if: env.IS_MAIN != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-runners
          retention-days: 1
          if-no-files-found: error
          path: |
            build/release/benchmark/benchmark_runner
            build/release/repository
            base/build/release/benchmark/benchmark_runner
            base/build/release/repository

  regression-test-benchmark-runner:
    name: Regression Tests (${{ matrix.format }})
    needs: build-benchmark-runners
    if: github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        format: [parquet, csv, json, avro]
        # parquet runs at SF1, the other formats at SF0.1 (TPC-H) and SF0.01 (TPC-DS)
        include:
          - format: parquet
            # q95: the CTE inliner can't copy the Glue scan (no deserialization function for read_parquet)
            tpcds_fail: '|85|95'
          - format: json
            tpcds_fail: '|95'
          - format: avro
            tpcds_fail: '|64|72|95'
    env:
      # the AWS SDK would otherwise ask the EC2 metadata service for a region, which hangs off EC2
      AWS_EC2_METADATA_DISABLED: "true"
      # Skipped in every format: the queries that take under 0.6s on parquet at SF1 and the ones that are mostly filtered
      # scans of a single table (TPC-H q06, TPC-DS q09, q28, q88, q90, q96). tpch_fail/tpcds_fail add the queries that
      # time out or come close (30s at 2 threads; TPC-DS q85 from a bad join order) or fail for a format.
      TPCH_SKIP: '02|06|11|14|15|16|20|22'
      TPCDS_SKIP: '01|03|06|09|12|15|19|20|21|22|28|30|34|36|39|41|42|43|45|52|53|55|57|59|62|63|73|81|84|88|89|90|96|98|99'

    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.GIT_REF }}
          submodules: 'true'

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Download benchmark runners
        uses: actions/download-artifact@v4
        with:
          name: benchmark-runners

      - name: Restore permissions
        run: chmod +x build/release/benchmark/benchmark_runner base/build/release/benchmark/benchmark_runner

      - name: Set up Docker Compose
        uses: docker/setup-compose-action@v1

      - name: Start Glue (moto) and S3
        run: docker compose -f scripts/docker-compose.yml up -d --wait

      # The benchmark files of the PR checkout are run by both runners (the benchmark runner resolves the paths
      # against the working directory, which test_runner.py isolates per runner).
      - name: Regression Test Hive Benchmarks
        if: matrix.format == 'parquet'
        run: |
          mkdir -p .github/regression
          ls benchmark/*.benchmark > .github/regression/hive_benchmarks.csv
          ls benchmark/pushdown/*.benchmark >> .github/regression/hive_benchmarks.csv
          ls benchmark/optimizer/*.benchmark >> .github/regression/hive_benchmarks.csv
          python duckdb/scripts/regression/test_runner.py --old base/build/release/benchmark/benchmark_runner --new build/release/benchmark/benchmark_runner --benchmarks .github/regression/hive_benchmarks.csv --verbose --threads 2 --samples 5

      # A step of its own so a TPC-H failure is visible on its own; it also runs when the step above fails
      - name: Tpch benchmarks
        if: ${{ !cancelled() }}
        run: |
          mkdir -p .github/regression
          ls benchmark/tpch/*/${{ matrix.format }}/*.benchmark | grep -vE "/q(${TPCH_SKIP}${{ matrix.tpch_fail }})\.benchmark$" > .github/regression/tpch_benchmarks.csv
          python duckdb/scripts/regression/test_runner.py --old base/build/release/benchmark/benchmark_runner --new build/release/benchmark/benchmark_runner --benchmarks .github/regression/tpch_benchmarks.csv --verbose --threads 2 --samples 5

      - name: Tpcds benchmarks
        if: ${{ !cancelled() }}
        run: |
          mkdir -p .github/regression
          ls benchmark/tpcds/*/${{ matrix.format }}/*.benchmark | grep -vE "/q(${TPCDS_SKIP}${{ matrix.tpcds_fail }})\.benchmark$" > .github/regression/tpcds_benchmarks.csv
          python duckdb/scripts/regression/test_runner.py --old base/build/release/benchmark/benchmark_runner --new build/release/benchmark/benchmark_runner --benchmarks .github/regression/tpcds_benchmarks.csv --verbose --threads 2 --samples 5

      - name: Server logs
        if: always()
        run: docker compose -f scripts/docker-compose.yml logs --no-color moto | tail -200
