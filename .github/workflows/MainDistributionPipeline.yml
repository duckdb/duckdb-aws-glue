#
# This workflow calls the main distribution pipeline from DuckDB to build, test and (optionally) release the extension
#
name: Main Extension Distribution Pipeline
on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.head_ref || '' }}-${{ github.base_ref || '' }}-${{ github.ref != 'refs/heads/main' && github.sha || '' }}
  cancel-in-progress: true

jobs:
  duckdb-stable-build:
    name: Build extension binaries
    uses: duckdb/extension-ci-tools/.github/workflows/_extension_distribution.yml@b8d325c37e82160886579880707493bd358c0e62 # v2.0-cyanoptera 2026-10-22 pin
    with:
      ci_tools_version: b8d325c37e82160886579880707493bd358c0e62 # v2.0-cyanoptera 2026-10-22 pin
      exclude_archs: 'wasm_mvp;wasm_eh;wasm_threads;windows_amd64_rtools;windows_amd64_mingw'
      extension_name: glue

  code-quality-check:
    name: Code Quality Check
    uses: duckdb/extension-ci-tools/.github/workflows/_extension_code_quality.yml@b8d325c37e82160886579880707493bd358c0e62 # v2.0-cyanoptera 2026-10-22 pin
    with:
      ci_tools_version: b8d325c37e82160886579880707493bd358c0e62 # v2.0-cyanoptera 2026-10-22 pin
      extension_name: glue
      format_checks: 'format'
