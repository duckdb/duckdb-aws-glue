# Local Glue + S3 for the tests: moto serves the Glue API, SeaweedFS serves S3. The 'init' service creates the S3 bucket,
# the Glue database 'default' the tests use, the bucketed table 'fixture_bucketed_multi' (bucket columns without a
# NumberOfBuckets, which the extension does not create), the tables 'fixture_struct_names' (struct field names with
# spaces, as other engines write them), 'fixture_orc' (a SerDe the extension can not read), the text tables
# 'fixture_text_*' with SerDe properties the extension does not write, and the views 'fixture_view_*' are written the
# way other engines write them, a DuckDB view copied from another database and one carrying a description and a
# foreign parameter (their SQL is never run, so the tables they name need not exist), so `docker compose up -d` is all
# the setup there is.
#   docker compose -f scripts/docker-compose.yml up -d
#   AWS_EC2_METADATA_DISABLED=true ./build/relassert/test/unittest --test-config test/configs/local_glue.json 'test/sql/*'
# Ports 5555 and 9100 are used so that they do not clash with macOS (5000) and other S3 instances (9000).
name: duckdb-glue
services:
  moto:
    image: motoserver/moto:5.2.3
    container_name: glue-moto
    ports:
      - "5555:5000"
    environment:
      - MOTO_PORT=5000
  s3:
    image: chrislusf/seaweedfs:4.47
    container_name: glue-s3
    ports:
      - "9100:8333"
    volumes:
      - ./seaweedfs-s3.json:/etc/seaweedfs/s3.json:ro
    command: ["server", "-dir=/data", "-ip.bind=0.0.0.0", "-s3", "-s3.port=8333", "-s3.config=/etc/seaweedfs/s3.json"]
  init:
    image: amazon/aws-cli:latest
    container_name: glue-init
    depends_on:
      - moto
      - s3
    environment:
      - AWS_ACCESS_KEY_ID=minio
      - AWS_SECRET_ACCESS_KEY=minio123
      - AWS_DEFAULT_REGION=us-east-1
      - AWS_EC2_METADATA_DISABLED=true
    entrypoint: |
      /bin/sh -c "
      until aws --endpoint-url http://s3:8333 s3 ls > /dev/null 2>&1; do echo 'waiting for S3'; sleep 1; done;
      aws --endpoint-url http://s3:8333 s3 mb s3://glue-test 2>/dev/null || true;
      until aws --endpoint-url http://moto:5000 glue get-databases > /dev/null 2>&1; do echo 'waiting for moto'; sleep 1; done;
      aws --endpoint-url http://moto:5000 glue create-database --database-input '{\"Name\": \"default\", \"LocationUri\": \"s3://glue-test/warehouse/default\"}' 2>/dev/null || true;
      aws --endpoint-url http://moto:5000 glue create-table --database-name default --table-input '{\"Name\": \"fixture_bucketed_multi\", \"TableType\": \"EXTERNAL_TABLE\", \"Parameters\": {\"EXTERNAL\": \"TRUE\", \"classification\": \"parquet\"}, \"StorageDescriptor\": {\"Columns\": [{\"Name\": \"id\", \"Type\": \"int\"}, {\"Name\": \"amount\", \"Type\": \"double\"}], \"Location\": \"s3://glue-test/warehouse/fixture/fixture_bucketed_multi\", \"InputFormat\": \"org.apache.hadoop.hive.ql.io.parquet.MapredParquetInputFormat\", \"OutputFormat\": \"org.apache.hadoop.hive.ql.io.parquet.MapredParquetOutputFormat\", \"SerdeInfo\": {\"SerializationLibrary\": \"org.apache.hadoop.hive.ql.io.parquet.serde.ParquetHiveSerDe\"}, \"BucketColumns\": [\"id\", \"amount\"]}}' 2>/dev/null || true;
      aws --endpoint-url http://moto:5000 glue create-table --database-name default --table-input '{\"Name\": \"fixture_orc\", \"TableType\": \"EXTERNAL_TABLE\", \"Parameters\": {\"EXTERNAL\": \"TRUE\", \"classification\": \"orc\"}, \"StorageDescriptor\": {\"Columns\": [{\"Name\": \"id\", \"Type\": \"int\"}, {\"Name\": \"amount\", \"Type\": \"double\"}], \"Location\": \"s3://glue-test/warehouse/fixture/fixture_orc\", \"InputFormat\": \"org.apache.hadoop.hive.ql.io.orc.OrcInputFormat\", \"OutputFormat\": \"org.apache.hadoop.hive.ql.io.orc.OrcOutputFormat\", \"SerdeInfo\": {\"SerializationLibrary\": \"org.apache.hadoop.hive.ql.io.orc.OrcSerde\"}}}' 2>/dev/null || true;
      aws --endpoint-url http://moto:5000 glue create-table --database-name default --table-input '{\"Name\": \"fixture_view_plain\", \"TableType\": \"VIRTUAL_VIEW\", \"ViewOriginalText\": \"SELECT id, amount FROM \\\"default\\\".fixture_view_base WHERE id > 1\", \"ViewExpandedText\": \"SELECT id, amount FROM \\\"default\\\".fixture_view_base WHERE id > 1\", \"StorageDescriptor\": {\"Columns\": [{\"Name\": \"id\", \"Type\": \"int\"}, {\"Name\": \"amount\", \"Type\": \"double\"}]}, \"Parameters\": {\"comment\": \"a Hive style view\"}}' 2>/dev/null || true;
      aws --endpoint-url http://moto:5000 glue create-table --database-name default --table-input '{\"Name\": \"fixture_view_lateral\", \"TableType\": \"VIRTUAL_VIEW\", \"ViewOriginalText\": \"SELECT team, score FROM default.matches LATERAL VIEW explode(scores) m AS score\", \"ViewExpandedText\": \"SELECT team, score FROM default.matches LATERAL VIEW explode(scores) m AS score\", \"StorageDescriptor\": {\"Columns\": [{\"Name\": \"team\", \"Type\": \"string\"}, {\"Name\": \"score\", \"Type\": \"int\"}]}, \"Parameters\": {}}' 2>/dev/null || true;
      aws --endpoint-url http://moto:5000 glue create-table --database-name default --table-input '{\"Name\": \"fixture_view_other\", \"TableType\": \"VIRTUAL_VIEW\", \"ViewOriginalText\": \"/* view: eyJzcWwiOiAiU0VMRUNUIDEifQ== */\", \"ViewExpandedText\": \"/* view */\", \"StorageDescriptor\": {\"Columns\": [{\"Name\": \"x\", \"Type\": \"int\"}]}, \"Parameters\": {\"other_engine_view\": \"true\"}, \"Description\": \"a view of another engine\"}' 2>/dev/null || true;
      aws --endpoint-url http://moto:5000 glue create-table --database-name default --table-input '{\"Name\": \"fixture_view_moved\", \"TableType\": \"VIRTUAL_VIEW\", \"ViewOriginalText\": \"SELECT 1 AS one\", \"ViewExpandedText\": \"SELECT 1 AS one\", \"StorageDescriptor\": {\"Columns\": [{\"Name\": \"one\", \"Type\": \"int\"}]}, \"Parameters\": {\"duckdb_view\": \"true\", \"duckdb_view_version\": \"1\", \"duckdb_view_default_database\": \"elsewhere\"}}' 2>/dev/null || true;
      aws --endpoint-url http://moto:5000 glue create-table --database-name default --table-input '{\"Name\": \"fixture_view_keep\", \"TableType\": \"VIRTUAL_VIEW\", \"ViewOriginalText\": \"SELECT 1 AS one\", \"ViewExpandedText\": \"SELECT 1 AS one\", \"Description\": \"kept across CREATE OR REPLACE\", \"StorageDescriptor\": {\"Columns\": [{\"Name\": \"one\", \"Type\": \"int\"}]}, \"Parameters\": {\"duckdb_view\": \"true\", \"duckdb_view_version\": \"1\", \"duckdb_view_default_database\": \"default\", \"owner_team\": \"analytics\"}}' 2>/dev/null || true;
      aws --endpoint-url http://moto:5000 glue create-table --database-name default --table-input '{\"Name\": \"fixture_struct_names\", \"TableType\": \"EXTERNAL_TABLE\", \"Parameters\": {\"EXTERNAL\": \"TRUE\", \"classification\": \"parquet\"}, \"StorageDescriptor\": {\"Columns\": [{\"Name\": \"s\", \"Type\": \"struct<a b :int,`c d`:string>\"}, {\"Name\": \"id\", \"Type\": \"int\"}], \"Location\": \"s3://glue-test/warehouse/fixture/fixture_struct_names\", \"InputFormat\": \"org.apache.hadoop.hive.ql.io.parquet.MapredParquetInputFormat\", \"OutputFormat\": \"org.apache.hadoop.hive.ql.io.parquet.MapredParquetOutputFormat\", \"SerdeInfo\": {\"SerializationLibrary\": \"org.apache.hadoop.hive.ql.io.parquet.serde.ParquetHiveSerDe\"}}}' 2>/dev/null || true;
      aws --endpoint-url http://moto:5000 glue create-table --database-name default --table-input '{\"Name\": \"fixture_text_default\", \"TableType\": \"EXTERNAL_TABLE\", \"Parameters\": {\"EXTERNAL\": \"TRUE\", \"classification\": \"csv\"}, \"StorageDescriptor\": {\"Columns\": [{\"Name\": \"id\", \"Type\": \"int\"}, {\"Name\": \"name\", \"Type\": \"string\"}, {\"Name\": \"amount\", \"Type\": \"double\"}], \"Location\": \"s3://glue-test/warehouse/fixture/fixture_text_default\", \"InputFormat\": \"org.apache.hadoop.mapred.TextInputFormat\", \"OutputFormat\": \"org.apache.hadoop.hive.ql.io.HiveIgnoreKeyTextOutputFormat\", \"SerdeInfo\": {\"SerializationLibrary\": \"org.apache.hadoop.hive.serde2.lazy.LazySimpleSerDe\", \"Parameters\": {}}}}' 2>/dev/null || true;
      aws --endpoint-url http://moto:5000 glue create-table --database-name default --table-input '{\"Name\": \"fixture_text_numeric_delim\", \"TableType\": \"EXTERNAL_TABLE\", \"Parameters\": {\"EXTERNAL\": \"TRUE\", \"classification\": \"csv\"}, \"StorageDescriptor\": {\"Columns\": [{\"Name\": \"id\", \"Type\": \"int\"}, {\"Name\": \"name\", \"Type\": \"string\"}, {\"Name\": \"amount\", \"Type\": \"double\"}], \"Location\": \"s3://glue-test/warehouse/fixture/fixture_text_numeric_delim\", \"InputFormat\": \"org.apache.hadoop.mapred.TextInputFormat\", \"OutputFormat\": \"org.apache.hadoop.hive.ql.io.HiveIgnoreKeyTextOutputFormat\", \"SerdeInfo\": {\"SerializationLibrary\": \"org.apache.hadoop.hive.serde2.lazy.LazySimpleSerDe\", \"Parameters\": {\"serialization.format\": \"9\"}}}}' 2>/dev/null || true;
      aws --endpoint-url http://moto:5000 glue create-table --database-name default --table-input '{\"Name\": \"fixture_text_null_format\", \"TableType\": \"EXTERNAL_TABLE\", \"Parameters\": {\"EXTERNAL\": \"TRUE\", \"classification\": \"csv\"}, \"StorageDescriptor\": {\"Columns\": [{\"Name\": \"id\", \"Type\": \"int\"}, {\"Name\": \"name\", \"Type\": \"string\"}, {\"Name\": \"amount\", \"Type\": \"double\"}], \"Location\": \"s3://glue-test/warehouse/fixture/fixture_text_null_format\", \"InputFormat\": \"org.apache.hadoop.mapred.TextInputFormat\", \"OutputFormat\": \"org.apache.hadoop.hive.ql.io.HiveIgnoreKeyTextOutputFormat\", \"SerdeInfo\": {\"SerializationLibrary\": \"org.apache.hadoop.hive.serde2.lazy.LazySimpleSerDe\", \"Parameters\": {\"field.delim\": \",\", \"serialization.null.format\": \"NA\"}}}}' 2>/dev/null || true;
      aws --endpoint-url http://moto:5000 glue create-table --database-name default --table-input '{\"Name\": \"fixture_text_opencsv\", \"TableType\": \"EXTERNAL_TABLE\", \"Parameters\": {\"EXTERNAL\": \"TRUE\", \"classification\": \"csv\"}, \"StorageDescriptor\": {\"Columns\": [{\"Name\": \"id\", \"Type\": \"int\"}, {\"Name\": \"name\", \"Type\": \"string\"}, {\"Name\": \"amount\", \"Type\": \"double\"}], \"Location\": \"s3://glue-test/warehouse/fixture/fixture_text_opencsv\", \"InputFormat\": \"org.apache.hadoop.mapred.TextInputFormat\", \"OutputFormat\": \"org.apache.hadoop.hive.ql.io.HiveIgnoreKeyTextOutputFormat\", \"SerdeInfo\": {\"SerializationLibrary\": \"org.apache.hadoop.hive.serde2.OpenCSVSerde\", \"Parameters\": {}}}}' 2>/dev/null || true;
      echo 'bucket glue-test, Glue database default, fixture tables and fixture views ready';
      "
