# Local Glue + S3 for the tests: moto serves the Glue API, MinIO serves S3. The 'init' service creates the S3 bucket,
# the Glue database 'default' the tests use, and the bucketed tables listed further down (the extension can not
# create bucketed tables), so `docker compose up -d` is all the setup there is; init is idempotent, so re-running it
# never needs the volumes wiped.
#   docker compose -f scripts/docker-compose.yml up -d
#   AWS_EC2_METADATA_DISABLED=true ./build/relassert/test/unittest --test-config test/configs/local_glue.json 'test/sql/*'
# Ports 5555 and 9100 are used so that they do not clash with macOS (5000) and other MinIO instances (9000).
#
# Each fixture table exists for one assertion, so removing any of them breaks a test:
#   fixture_bucketed          bucket column, a count and one sort column -- writes to it are refused
#   fixture_bucketed_multi    two bucket columns, no count, unsorted
#   fixture_bucket_plain      NOT bucketed: the control the next three are compared against
#   fixture_bucket_hashed     one bucket column, count 4, unsorted -- the ordinary bucketed case
#   fixture_bucket_sorted     two bucket columns and both sort directions, so ASC/DESC round-trips
#   fixture_bucket_zerocount  bucket columns with NumberOfBuckets 0, Hive's 'unbucketed' spelling
# The last four share a location, so they are the same bytes carrying different metadata.
# A test writes what it needs there.
name: duckdb-glue
services:
  moto:
    image: motoserver/moto:5.2.3
    container_name: glue-moto
    ports:
      - "5555:5000"
    environment:
      - MOTO_PORT=5000
  minio:
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: glue-minio
    ports:
      - "9100:9000"
      - "9101:9001"
    environment:
      - MINIO_ROOT_USER=minio
      - MINIO_ROOT_PASSWORD=minio123
    command: ["server", "/data", "--console-address", ":9001"]
  init:
    image: amazon/aws-cli:latest
    container_name: glue-init
    depends_on:
      - moto
      - minio
    environment:
      - AWS_ACCESS_KEY_ID=minio
      - AWS_SECRET_ACCESS_KEY=minio123
      - AWS_DEFAULT_REGION=us-east-1
      - AWS_EC2_METADATA_DISABLED=true
    entrypoint: |
      /bin/sh -c "
      until aws --endpoint-url http://minio:9000 s3 ls > /dev/null 2>&1; do echo 'waiting for MinIO'; sleep 1; done;
      aws --endpoint-url http://minio:9000 s3 mb s3://glue-test 2>/dev/null || true;
      until aws --endpoint-url http://moto:5000 glue get-databases > /dev/null 2>&1; do echo 'waiting for moto'; sleep 1; done;
      aws --endpoint-url http://moto:5000 glue create-database --database-input '{\"Name\": \"default\", \"LocationUri\": \"s3://glue-test/warehouse/default\"}' 2>/dev/null || true;
      aws --endpoint-url http://moto:5000 glue create-table --database-name default --table-input '{\"Name\": \"fixture_bucketed\", \"TableType\": \"EXTERNAL_TABLE\", \"Parameters\": {\"EXTERNAL\": \"TRUE\", \"classification\": \"parquet\"}, \"StorageDescriptor\": {\"Columns\": [{\"Name\": \"id\", \"Type\": \"int\"}, {\"Name\": \"amount\", \"Type\": \"double\"}], \"Location\": \"s3://glue-test/warehouse/fixture/fixture_bucketed\", \"InputFormat\": \"org.apache.hadoop.hive.ql.io.parquet.MapredParquetInputFormat\", \"OutputFormat\": \"org.apache.hadoop.hive.ql.io.parquet.MapredParquetOutputFormat\", \"SerdeInfo\": {\"SerializationLibrary\": \"org.apache.hadoop.hive.ql.io.parquet.serde.ParquetHiveSerDe\"}, \"BucketColumns\": [\"id\"], \"NumberOfBuckets\": 4, \"SortColumns\": [{\"Column\": \"id\", \"SortOrder\": 1}]}}' 2>/dev/null || true;
      aws --endpoint-url http://moto:5000 glue create-table --database-name default --table-input '{\"Name\": \"fixture_bucketed_multi\", \"TableType\": \"EXTERNAL_TABLE\", \"Parameters\": {\"EXTERNAL\": \"TRUE\", \"classification\": \"parquet\"}, \"StorageDescriptor\": {\"Columns\": [{\"Name\": \"id\", \"Type\": \"int\"}, {\"Name\": \"amount\", \"Type\": \"double\"}], \"Location\": \"s3://glue-test/warehouse/fixture/fixture_bucketed_multi\", \"InputFormat\": \"org.apache.hadoop.hive.ql.io.parquet.MapredParquetInputFormat\", \"OutputFormat\": \"org.apache.hadoop.hive.ql.io.parquet.MapredParquetOutputFormat\", \"SerdeInfo\": {\"SerializationLibrary\": \"org.apache.hadoop.hive.ql.io.parquet.serde.ParquetHiveSerDe\"}, \"BucketColumns\": [\"id\", \"amount\"]}}' 2>/dev/null || true;
      aws --endpoint-url http://moto:5000 glue create-table --database-name default --table-input '{\"Name\": \"fixture_bucket_plain\", \"TableType\": \"EXTERNAL_TABLE\", \"Parameters\": {\"EXTERNAL\": \"TRUE\", \"classification\": \"parquet\"}, \"StorageDescriptor\": {\"Columns\": [{\"Name\": \"id\", \"Type\": \"int\"}, {\"Name\": \"amount\", \"Type\": \"double\"}, {\"Name\": \"region\", \"Type\": \"string\"}], \"Location\": \"s3://glue-test/warehouse/fixture/bucket_read\", \"InputFormat\": \"org.apache.hadoop.hive.ql.io.parquet.MapredParquetInputFormat\", \"OutputFormat\": \"org.apache.hadoop.hive.ql.io.parquet.MapredParquetOutputFormat\", \"SerdeInfo\": {\"SerializationLibrary\": \"org.apache.hadoop.hive.ql.io.parquet.serde.ParquetHiveSerDe\"}}}' 2>/dev/null || true;
      aws --endpoint-url http://moto:5000 glue create-table --database-name default --table-input '{\"Name\": \"fixture_bucket_hashed\", \"TableType\": \"EXTERNAL_TABLE\", \"Parameters\": {\"EXTERNAL\": \"TRUE\", \"classification\": \"parquet\"}, \"StorageDescriptor\": {\"Columns\": [{\"Name\": \"id\", \"Type\": \"int\"}, {\"Name\": \"amount\", \"Type\": \"double\"}, {\"Name\": \"region\", \"Type\": \"string\"}], \"Location\": \"s3://glue-test/warehouse/fixture/bucket_read\", \"InputFormat\": \"org.apache.hadoop.hive.ql.io.parquet.MapredParquetInputFormat\", \"OutputFormat\": \"org.apache.hadoop.hive.ql.io.parquet.MapredParquetOutputFormat\", \"SerdeInfo\": {\"SerializationLibrary\": \"org.apache.hadoop.hive.ql.io.parquet.serde.ParquetHiveSerDe\"}, \"BucketColumns\": [\"id\"], \"NumberOfBuckets\": 4}}' 2>/dev/null || true;
      aws --endpoint-url http://moto:5000 glue create-table --database-name default --table-input '{\"Name\": \"fixture_bucket_sorted\", \"TableType\": \"EXTERNAL_TABLE\", \"Parameters\": {\"EXTERNAL\": \"TRUE\", \"classification\": \"parquet\"}, \"StorageDescriptor\": {\"Columns\": [{\"Name\": \"id\", \"Type\": \"int\"}, {\"Name\": \"amount\", \"Type\": \"double\"}, {\"Name\": \"region\", \"Type\": \"string\"}], \"Location\": \"s3://glue-test/warehouse/fixture/bucket_read\", \"InputFormat\": \"org.apache.hadoop.hive.ql.io.parquet.MapredParquetInputFormat\", \"OutputFormat\": \"org.apache.hadoop.hive.ql.io.parquet.MapredParquetOutputFormat\", \"SerdeInfo\": {\"SerializationLibrary\": \"org.apache.hadoop.hive.ql.io.parquet.serde.ParquetHiveSerDe\"}, \"BucketColumns\": [\"id\", \"region\"], \"NumberOfBuckets\": 8, \"SortColumns\": [{\"Column\": \"id\", \"SortOrder\": 1}, {\"Column\": \"region\", \"SortOrder\": 0}]}}' 2>/dev/null || true;
      aws --endpoint-url http://moto:5000 glue create-table --database-name default --table-input '{\"Name\": \"fixture_bucket_zerocount\", \"TableType\": \"EXTERNAL_TABLE\", \"Parameters\": {\"EXTERNAL\": \"TRUE\", \"classification\": \"parquet\"}, \"StorageDescriptor\": {\"Columns\": [{\"Name\": \"id\", \"Type\": \"int\"}, {\"Name\": \"amount\", \"Type\": \"double\"}, {\"Name\": \"region\", \"Type\": \"string\"}], \"Location\": \"s3://glue-test/warehouse/fixture/bucket_read\", \"InputFormat\": \"org.apache.hadoop.hive.ql.io.parquet.MapredParquetInputFormat\", \"OutputFormat\": \"org.apache.hadoop.hive.ql.io.parquet.MapredParquetOutputFormat\", \"SerdeInfo\": {\"SerializationLibrary\": \"org.apache.hadoop.hive.ql.io.parquet.serde.ParquetHiveSerDe\"}, \"BucketColumns\": [\"id\"], \"NumberOfBuckets\": 0}}' 2>/dev/null || true;
      echo 'bucket glue-test, Glue database default and bucketed fixture tables ready';
      "
